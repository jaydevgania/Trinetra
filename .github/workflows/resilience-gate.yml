name: Trinetra Blockchain Resilience Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  consensus-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cryptographic & Consensus Invariant Unit Tests
        run: |
          pytest tests -v

      - name: Execute Resilience Score CI Gate (Threshold: 80)
        run: |
          python -m bench.run_bench --scenario latency_storm --fail-under 80
